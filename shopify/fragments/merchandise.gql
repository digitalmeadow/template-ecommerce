fragment Merchandise on ProductVariant {
  id
  title
  sku
  availableForSale
  quantityAvailable
  selectedOptions {
    name
    value
  }
  price {
    ...Money
  }
  compareAtPrice {
    ...Money
  }
  image {
    ...Image
  }
  product {
    id
    title
    handle
    vendor
    featuredImage {
      ...Image
    }
  }
}
