# Thumbnails and collection grids.
fragment ProductCard on Product {
  __typename
  id
  title
  handle
  availableForSale

  priceRange {
    ...PriceRange
  }

  compareAtPriceRange {
    ...PriceRange
  }
}

# Product pages. Every variant is loaded (stores here stay under Shopify's 250), so option
# availability is computed from the list rather than Shopify's encoded variant strings.
fragment Product on Product {
  ...ProductCard
  vendor
  productType

  options {
    ...ProductOption
  }

  variants(first: 250) {
    nodes {
      ...ProductVariant
    }
  }
}

fragment ProductOption on ProductOption {
  name
  optionValues {
    name
    swatch {
      color
      image {
        previewImage {
          url(transform: { maxWidth: 96 })
        }
      }
    }
  }
}
