fragment Cart on Cart {
  id
  updatedAt
  checkoutUrl
  totalQuantity
  note
  attributes {
    key
    value
  }
  buyerIdentity {
    countryCode
  }
  cost {
    subtotalAmount {
      ...Money
    }
    totalAmount {
      ...Money
    }
  }
  discountCodes {
    applicable
    code
  }
  appliedGiftCards {
    id
    lastCharacters
    amountUsed {
      ...Money
    }
  }
  lines(first: 100) {
    nodes {
      ...CartLine
    }
  }
}

fragment CartLine on BaseCartLine {
  id
  quantity
  attributes {
    key
    value
  }
  cost {
    totalAmount {
      ...Money
    }
    amountPerQuantity {
      ...Money
    }
    compareAtAmountPerQuantity {
      ...Money
    }
  }
  discountAllocations {
    discountedAmount {
      ...Money
    }
  }
  merchandise {
    ... on ProductVariant {
      ...Merchandise
    }
  }
}
