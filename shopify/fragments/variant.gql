fragment ProductVariant on ProductVariant {
  id
  title
  sku
  barcode
  availableForSale
  quantityAvailable

  selectedOptions {
    name
    value
  }

  price {
    ...Money
  }

  compareAtPrice {
    ...Money
  }

  image {
    ...Image
  }
}

# What changes between builds: re-fetched on product pages so price and stock are live.
fragment ProductVariantLive on ProductVariant {
  id
  availableForSale
  quantityAvailable

  price {
    ...Money
  }

  compareAtPrice {
    ...Money
  }
}
